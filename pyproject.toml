[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opgd-cli"
version = "0.1.1"
description = "基于最优参数的地理探测器（OPGD, Optimal Parameters-based Geographical Detector）平台命令行客户端 —— 上传数据、提交分析、终端渲染报告"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "OPGD" }]
keywords = ["opgd", "geodetector", "geographical-detector", "optimal-parameters", "地理探测器", "最优参数", "地理探测器分析", "gis", "spatial-analysis", "spatial-statistics", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "tomli-w>=1.0; python_version >= '3.10'",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[project.scripts]
opgd = "opgd_cli.app:main"

[project.urls]
Homepage = "https://github.com/seedgcoding/OPGD_CLI"
Documentation = "https://github.com/seedgcoding/OPGD_CLI"
Platform = "https://opgd500.kkbvip.top"

[tool.hatch.build.targets.wheel]
packages = ["src/opgd_cli"]

[tool.hatch.build.targets.sdist]
include = [
    "src/opgd_cli",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "llms.txt",
    "pyproject.toml",
]
exclude = [
    "results",
    ".zcode",
    "dist",
    "sample_data.csv",
    "*.egg-info",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
