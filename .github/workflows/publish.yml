name: Publish to PyPI

# 发版流程：改 pyproject.toml + __init__.py 版本号 → commit → 打 tag v<版本> → push tag
# 例：git tag v0.1.2 && git push origin v0.1.2
# 前置：PyPI 项目页绑定 Trusted Publisher（owner=seedgcoding, repo=OPGD_CLI, workflow=publish.yml, env=pypi）

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 校验 tag 与包版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 pyproject 版本 $PKG 不一致"
            exit 1
          fi

      - name: 安装并跑测试（发布前回归）
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[dev]"
          pytest -q

      - name: 构建 sdist + wheel
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing：PyPI 通过 OIDC 验证本 workflow 身份，无需 API token
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 发布到 PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
